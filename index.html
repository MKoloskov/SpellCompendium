<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ellador&#x27;s Spell Compendium</title>
<style>
:root{--bg:#faf8f3;--panel:#fff;--ink:#22201c;--muted:#6f6a60;--line:#e4dfd3;--accent:#7a3b2e;--chip:#f1ece1;--chip-on:#7a3b2e;--chip-on-ink:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#17161a;--panel:#201f24;--ink:#ece8df;--muted:#a19b8f;--line:#34323a;--accent:#d98c6f;--chip:#2a2930;--chip-on:#d98c6f;--chip-on-ink:#17161a}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:0;z-index:2;background:var(--bg);border-bottom:1px solid var(--line);padding:12px 16px 8px}
h1{font:600 20px/1.2 Georgia,serif;margin:0 0 8px;color:var(--accent)}
.mode{font:12px system-ui;color:var(--muted);margin-left:8px}
#q{width:100%;padding:10px 12px;font-size:16px;border:1px solid var(--line);border-radius:8px;background:var(--panel);color:var(--ink)}
.filters{display:flex;flex-wrap:wrap;gap:6px 14px;margin-top:8px;align-items:center}
.group{display:flex;flex-wrap:wrap;gap:4px;align-items:center}.group b{font-size:12px;color:var(--muted);font-weight:600;margin-right:2px}
.chip{border:0;background:var(--chip);color:var(--ink);padding:3px 9px;border-radius:999px;font-size:13px;cursor:pointer}
.chip.on{background:var(--chip-on);color:var(--chip-on-ink)}
.bar{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted);margin-top:6px}
.bar button{background:none;border:0;color:var(--accent);cursor:pointer;font-size:13px}
main{max-width:980px;margin:0 auto;padding:8px 12px 60px}
details{scroll-margin-top:var(--hh,170px);background:var(--panel);border:1px solid var(--line);border-radius:10px;margin:8px 0}
summary{list-style:none;cursor:pointer;padding:10px 14px;display:grid;grid-template-columns:1fr auto;gap:2px 12px}
summary::-webkit-details-marker{display:none}
.name{font:600 16px Georgia,serif}.lvl{font-size:13px;color:var(--accent);text-align:right;white-space:nowrap}
.meta{grid-column:1/-1;font-size:13px;color:var(--muted)}
.tag{display:inline-block;font-size:11px;border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-left:6px;color:var(--muted);vertical-align:2px}
.tag.draft{border-color:var(--accent);color:var(--accent)}
.body{padding:0 14px 14px;border-top:1px solid var(--line)}
dl{display:grid;grid-template-columns:max-content 1fr;gap:3px 14px;font-size:13.5px;margin:12px 0}
dt{color:var(--muted)}dd{margin:0;word-break:break-word}
.desc p{margin:.6em 0}.desc ul{margin:.4em 0;padding-left:1.3em}
h3{font:600 14px system-ui;margin:14px 0 4px;color:var(--accent)}
.empty{text-align:center;color:var(--muted);padding:40px}
a.perma{font-size:12px;color:var(--muted);text-decoration:none}
dd a{color:var(--accent)}
</style></head><body>
<header>
  <h1>Ellador&#x27;s Spell Compendium<span class="mode">DM preview: drafts included</span></h1>
  <input id="q" type="search" placeholder="Search spells: name, text, components…  (press / to focus)" autocomplete="off">
  <div class="filters" id="filters"></div>
  <div class="bar"><span id="count"></span><span><button id="sort"></button> · <button id="reset">Reset filters</button></span></div>
</header>
<main id="list"></main>
<script>
const SPELLS = [{"id": "absorb-elements", "name": "Absorb Elements", "aliases": [], "level": 1, "school": "Abjuration", "domain": ["Arcane", "Primal"], "chars": [], "cast": ["Reaction"], "ritual": false, "conc": "No", "range": "Self", "duration": "1 round", "draft": true, "fields": [["School", "Abjuration"], ["Domain", "Arcane, Primal"], ["Scarcity", "Common"], ["Casting time", "Reaction"], ["Components", "S"], ["Duration", "1 round"], ["Concentration", "No"], ["Range / Target / Area", "Self"]], "desc": "The spell captures some of the incoming energy, lessening its effect on you and storing it for your next melee attack. You have resistance to the triggering damage type until the start of your next turn. Also, the first time you hit with a melee attack on your next turn, the target takes an extra 1d6 damage of the triggering type, and the spell ends.", "higher": "For each spell slot above 1st, the extra damage increases by 1d6 for each slot level above 1st."}, {"id": "alarm", "name": "Alarm", "aliases": [], "level": 1, "school": "Abjuration", "domain": ["Arcane"], "chars": [], "cast": ["1 minute"], "ritual": true, "conc": "No", "range": "20' cube", "duration": "8 hours", "draft": true, "fields": [["School", "Abjuration"], ["Domain", "Arcane"], ["Scarcity", "Common"], ["Casting time", "1 minute"], ["Ritual", "Yes"], ["Components", "V, S, M (wire, rope or salt), F (bell)"], ["Duration", "8 hours"], ["Concentration", "No"], ["Range / Target / Area", "20' cube"], ["Specialization", "For each 2 Caster levels above 1st, you can enlarge the area of you Alarm by another 20' cube, or create another another 20' cube Alarm "]], "desc": "You set an alarm against unwanted intrusion. Choose a door, a window, or an area within range that is no larger than a 20-foot cube. Until the spell ends, an alarm alerts you whenever a Tiny or larger creature touches or enters the warded area. When you cast the spell, you can designate creatures that won't set off the alarm. You also choose whether the alarm is mental or audible.\n\nA mental alarm alerts you with a ping in your mind if you are within 1 mile of the warded area. This ping awakens you if you are sleeping.\n\nAn audible alarm produces the sound of a hand bell for 10 seconds within 60 feet.", "higher": ""}, {"id": "hunter-sense", "name": "Hunter Sense", "aliases": [], "level": 1, "school": "Transmutation", "domain": [], "chars": [], "cast": ["Standard"], "ritual": true, "conc": "No", "range": "Self", "duration": "8 hours", "draft": true, "fields": [["School", "Transmutation"], ["Casting time", "Standard"], ["Ritual", "Yes"], ["Components", "V, S"], ["Duration", "8 hours"], ["Concentration", "No"], ["Range / Target / Area", "Self"], ["Source", "https://2014.5e.tools/spells.html#hunter%20sense_grimhollowlairsetharis"]], "desc": "The spells highly enhances one sense for the cost of slightly dampening others.\nCaster selects ONE sense (Sight, Hearing, Smell, Taste, Touch).\nThis sense is heightened for the next 8 hours (Perception/Insight check made with that sense receive a bonus)\nOther senses are dampened (Perception/Insight checks made with these senses receive the penalty of the same size).\n\nThe more \"universal\" a sense is, the lower the bonus/penalty it receives:\n- Sight: +/- d4\n- Hearing, Smell: +/- d6\n- Touch, Taste: +/- Advantage\n\nI.e. buffing Sight gives +d4 on all Percetion/Insight checks made with Slight and -d4 on all Perception/Insight checks made with other senses; buffing Touch gives Advantage on Touch and Disadvantage on all other senses.\n\nThe effect can only be applied during Long Rest can't be changed during the duration.", "higher": ""}, {"id": "mage-armor", "name": "Mage Armor", "aliases": [], "level": 1, "school": "Abjuration", "domain": ["Arcane"], "chars": [], "cast": ["Standard"], "ritual": false, "conc": "No", "range": "Self", "duration": "8 hours", "draft": true, "fields": [["School", "Abjuration"], ["Domain", "Arcane"], ["Scarcity", "Common"], ["Casting time", "Standard"], ["Components", "V, S, M (a piece of cured leather)"], ["Duration", "8 hours"], ["Concentration", "No"], ["Range / Target / Area", "Self"], ["Specialization", "For each spell slot above 1st, AC gets another +1"]], "desc": "You touch a willing creature who isn't wearing armor, and a protective magical force surrounds it until the spell ends. The target's base AC becomes 13 + its Dexterity modifier. The spell ends if the target dons armor or if you dismiss the spell as an action.", "higher": "??"}, {"id": "magic-barrier", "name": "Magic Barrier", "aliases": [], "level": 1, "school": "Abjuration", "domain": [], "chars": [], "cast": ["Standard"], "ritual": false, "conc": "", "range": "Allies of up to max. # of barriers each within 60' of caster", "duration": "1 round OR Concentration, up to 1 min", "draft": true, "fields": [["School", "Abjuration"], ["Casting time", "Standard"], ["Components", "V, S, M"], ["Duration", "1 round OR Concentration, up to 1 min"], ["Range / Target / Area", "Allies of up to max. # of barriers each within 60' of caster"], ["Source", "https://homebrewery.naturalcrit.com/share/rktnMrU7cS"]], "desc": "You create multiple magical barriers to absorb some of the incoming damage to creatures of your choice that you can see within range, the barriers take place simultaneously and you can direct them to protect one creature or several.\n\nEach barrier can block up to 1d4+1 damage and disappears right after getting DMG up to its limit. The reduction occurs BEFORE any resistance or immunity the protected creatures posesses is considered.", "higher": "When you cast this spell using a spell slot of 2nd level or higher, the spell creates one more barrier for each slot level above 1st."}, {"id": "magic-cover", "name": "Magic Cover", "aliases": [], "level": 2, "school": "Abjuration", "domain": [], "chars": [], "cast": ["Standard"], "ritual": false, "conc": "", "range": "X points within 15' of caster each", "duration": "2 rounds OR Concentration, up to 1 min", "draft": true, "fields": [["School", "Abjuration"], ["Casting time", "Standard"], ["Components", "V, S, M"], ["Duration", "2 rounds OR Concentration, up to 1 min"], ["Range / Target / Area", "X points within 15' of caster each"], ["Source", "https://homebrewery.naturalcrit.com/share/rktnMrU7cS"]], "desc": "Three panels of magical force appears in an unoccupied space in front of you. Each panel is a 5 feet square and rests on the ground in a vertical position. The panel provide half cover for one medium creature standing behind it. A prone creature behind one panel is considered under full cover for attacks coming from the side that the panel is facing. The panels are immobile, have an 8 AC and 20 HP each.", "higher": "you can create 1 more panel OR give all your panels +1 AC and + 5 HP for each level above 1st."}, {"id": "nature-s-bounty", "name": "Nature's Bounty", "aliases": [], "level": 1, "school": "Transmutation", "domain": [], "chars": [], "cast": ["Standard"], "ritual": false, "conc": "No", "range": "Objects up to 1d4 doses/spell level", "duration": "24 hours", "draft": true, "fields": [["School", "Transmutation"], ["Casting time", "Standard"], ["Components", "V, S, M (freshly-foraged food)"], ["Duration", "24 hours"], ["Concentration", "No"], ["Range / Target / Area", "Objects up to 1d4 doses/spell level"], ["Source", "https://docs.google.com/document/d/1M4r9fymI3d5gKxiE3DrL0W75Bi9Cgl3_ui0tBkDO274/edit?tab=t.0#heading=h.cknle4jx0yrz"]], "desc": "You infuse the freshly foraged food (it can't be cooked or enhanced in any way) with restorative magic.\n\nFor the duration, a creature can eat one dose to sate its hunger and gain 1 HP. Each dose counts as a small meal, 3 doses are enough to sustain a Medium-sized person for the day, 6 doses are enough to be considered nourishing.\nThe infused food spoils after 24 hours if not eaten and can't be infused with this magic again.", "higher": "you can infuse 1d4 more doses for each spell level after 1st."}, {"id": "outer-shell", "name": "Outer Shell", "aliases": [], "level": 2, "school": "Abjuration", "domain": [], "chars": [], "cast": ["Reaction"], "ritual": false, "conc": "No", "range": "X targets within 10' of caster", "duration": "1 round", "draft": true, "fields": [["School", "Abjuration"], ["Casting time", "Reaction"], ["Components", "V, S"], ["Duration", "1 round"], ["Concentration", "No"], ["Range / Target / Area", "X targets within 10' of caster"], ["Source", "https://www.dndbeyond.com/spells/34364-aegis"]], "desc": "You create translucent barriers that soften blows and decrease friction, allowing swifter movement. \n\nYou target 2 allies (can include self). Whenever these allies are required to make a STR or DEX save from an effect that can deal damage, they take NO damage on a successful save and only HALF damage on a failed one.", "higher": "- you can add 1 more ally for each level above 3rd"}, {"id": "reflective-armor-armor-of-agathys", "name": "Reflective Armor (Armor of Agathys)", "aliases": ["Armor of Agathys"], "level": 1, "school": "Abjuration", "domain": ["Divine"], "chars": [], "cast": ["Standard"], "ritual": false, "conc": "No", "range": "Self", "duration": "1 hour", "draft": true, "fields": [["School", "Abjuration"], ["Domain", "Divine"], ["Scarcity", "Uncommon"], ["Casting time", "Standard"], ["Components", "V, S, M (a bit of elemental subtance)"], ["Duration", "1 hour"], ["Concentration", "No"], ["Range / Target / Area", "Self"]], "desc": "A protective magical force surrounds you, manifesting as a spectral frost that covers you and your gear. You gain 5 temporary hit points for the duration. If a creature hits you with a melee attack while you have these hit points, the creature takes 5 elemental damage (damage type depends on the divine origin)", "higher": "For each spell slot above 1st, both the temporary hit points and the cold damage increase by 5 for each slot level above 1st."}, {"id": "repel", "name": "Repel", "aliases": [], "level": 2, "school": "Abjuration", "domain": [], "chars": [], "cast": ["Standard"], "ritual": false, "conc": "No", "range": "Ally within 60' of caster", "duration": "1 round", "draft": true, "fields": [["School", "Abjuration"], ["Casting time", "Standard"], ["Components", "V, S"], ["Duration", "1 round"], ["Concentration", "No"], ["Range / Target / Area", "Ally within 60' of caster"], ["Source", "https://homebrewery.naturalcrit.com/share/rktnMrU7cS"]], "desc": "Choose one creature that you can see within range. \nA protective force sweeps out of the target of this spell, attemtping to drive all creatures away from it and stop them from engaging the target. \nEvery creature of Medium size or smaller around the target must suceed on a Strength saving throw or take 2d6 force damage and be pushed 10' away from the target. Creatures 1 size larger get Advantage on the save; creatures get more that 1 size larger get Advantage and are not affected by the push.\nOn a successful save, the creature takes half of the damage and isn't pushed. \n\nUntil the start of your next turn, each Pushed creature that tries to move within 5' of the target must succeed on a Strength saving throw or it will be blocked by the magical force field.", "higher": "- you can deal +1d6 damage for each level above 2nd;\n- you can affect creatures of 1 size larger for each 2 levels above 2nd."}];
const ORD = n => n===0 ? "Cantrip" : n+(["th","st","nd","rd"][(n%100>10&&n%100<14)?0:Math.min(n%10,4)%4]||"th")+" Circle";
const lvlName = n => n==null ? "Unleveled" : ORD(n);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function md(src){
  if(!src) return "";
  const inline = t => esc(t)
    .replace(/\[\[([^\]|]+)\|([^\]]+)\]\]/g,"$2").replace(/\[\[([^\]]+)\]\]/g,"$1")
    .replace(/\*\*(.+?)\*\*/g,"<b>$1</b>").replace(/(^|[^*])\*([^*]+)\*/g,"$1<i>$2</i>");
  return src.trim().split(/\n\s*\n/).map(block => {
    const lines = block.split("\n");
    if(lines.every(l => /^\s*[-*]\s+/.test(l))) return "<ul>"+lines.map(l=>"<li>"+inline(l.replace(/^\s*[-*]\s+/,""))+"</li>").join("")+"</ul>";
    return "<p>"+lines.map(l => /^\s*[-*]\s+/.test(l) ? "• "+inline(l.replace(/^\s*[-*]\s+/,"")) : inline(l)).join("<br>")+"</p>";
  }).join("");
}
const FILTERS = [
  {key:"level", label:"Circle", get:s=>[s.level==null?"—":String(s.level)], fmt:v=>v==="0"?"Cantrip":v},
  {key:"school", label:"School", get:s=>s.school?[s.school]:[]},
  {key:"domain", label:"Domain", get:s=>s.domain},
  {key:"chars", label:"Available to", get:s=>s.chars},
  {key:"cast", label:"Casting", get:s=>s.cast},
  {key:"flags", label:"Tags", get:s=>[...(s.ritual?["Ritual"]:[]), ...(s.conc==="Yes"?["Concentration"]:[])]},
];
const state = {q:"", sel:{}, byName:false};
FILTERS.forEach(f => state.sel[f.key] = new Set());
const box = document.getElementById("filters");
FILTERS.forEach(f => {
  const vals = [...new Set(SPELLS.flatMap(f.get))].sort((a,b)=> f.key==="level" ? (+a)-(+b) : a.localeCompare(b));
  if(!vals.length) return;
  const g = document.createElement("div"); g.className="group"; g.innerHTML = "<b>"+f.label+"</b>";
  vals.forEach(v => { const b=document.createElement("button"); b.className="chip"; b.textContent=f.fmt?f.fmt(v):v;
    b.onclick=()=>{ const s=state.sel[f.key]; s.has(v)?s.delete(v):s.add(v); b.classList.toggle("on"); render(true); }; g.appendChild(b); });
  box.appendChild(g);
});
const hay = s => [s.name, ...s.aliases, s.school, s.desc, s.higher, ...s.fields.map(f=>f[1])].join(" ").toLowerCase();
SPELLS.forEach(s => s._h = hay(s));
function render(top){
  if(top) window.scrollTo(0,0);
  const terms = state.q.toLowerCase().split(/\s+/).filter(Boolean);
  let out = SPELLS.filter(s => terms.every(t => s._h.includes(t)) &&
    FILTERS.every(f => { const sel=state.sel[f.key]; if(!sel.size) return true; const v=f.get(s); return f.key==="flags" ? [...sel].every(x=>v.includes(x)) : v.some(x=>sel.has(x)); }));
  out.sort((a,b) => state.byName ? a.name.localeCompare(b.name) : ((a.level??99)-(b.level??99) || a.name.localeCompare(b.name)));
  document.getElementById("count").textContent = out.length+" of "+SPELLS.length+" spells";
  document.getElementById("sort").textContent = state.byName ? "Sort: A–Z" : "Sort: by circle";
  const open = location.hash.slice(1);
  document.getElementById("list").innerHTML = out.length ? out.map(s => `
<details id="${s.id}"${s.id===open||out.length===1?" open":""}>
<summary><span class="name">${esc(s.name)}${s.ritual?'<span class="tag">Ritual</span>':""}${s.conc==="Yes"?'<span class="tag">Conc.</span>':""}${s.draft?'<span class="tag draft">Draft</span>':""}</span>
<span class="lvl">${esc(lvlName(s.level))}${s.school?" · "+esc(s.school):""}</span>
<span class="meta">${[s.cast.join(" or "),s.range,s.duration].filter(Boolean).map(esc).join(" · ")}${s.aliases.length?" · aka "+s.aliases.map(esc).join(", "):""}</span></summary>
<div class="body"><dl>${s.fields.map(([k,v])=>`<dt>${esc(k)}</dt><dd>${/^https?:\/\//.test(v)?`<a href="${esc(v)}" target="_blank" rel="noopener">${esc(v.replace(/^https?:\/\//,"").slice(0,48))}…</a>`:esc(v)}</dd>`).join("")}</dl>
<div class="desc">${md(s.desc)}</div>${s.higher?`<h3>At higher levels</h3><div class="desc">${md(s.higher)}</div>`:""}
<a class="perma" href="#${s.id}">Link to this spell</a></div></details>`).join("") : '<div class="empty">No spells match.</div>';
}
const q = document.getElementById("q");
q.oninput = () => { state.q = q.value; render(true); };
document.getElementById("sort").onclick = () => { state.byName = !state.byName; render(); };
document.getElementById("reset").onclick = () => { state.q=""; q.value=""; Object.values(state.sel).forEach(s=>s.clear()); document.querySelectorAll(".chip.on").forEach(c=>c.classList.remove("on")); render(true); };
document.addEventListener("keydown", e => { if(e.key==="/" && document.activeElement!==q){ e.preventDefault(); q.focus(); } });
window.addEventListener("hashchange", () => { const d=document.getElementById(location.hash.slice(1)); if(d){ d.open=true; d.scrollIntoView({block:"start"}); } });
const setHH=()=>document.documentElement.style.setProperty("--hh",document.querySelector("header").offsetHeight+8+"px");
setHH(); window.addEventListener("resize",setHH);
render();
if(location.hash){ const d=document.getElementById(location.hash.slice(1)); if(d) d.scrollIntoView({block:"start"}); }
</script></body></html>
